<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Bright: Student Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#FAFAF8;--bg-dark:#1B2A1F;--card:#FFFFFF;--border:#E8E5DE;--text:#1A1D1A;--text-secondary:#5A5F58;--text-muted:#6A6E67;--green:#2E7D4F;--green-light:#E8F5EC;--green-glow:#43A66A;--green-dark:#1B5E3A;--gold:#E6A817;--gold-light:#FEF8E7;--red:#C62828;--red-light:#FDEAEA;--blue:#3BA4D9;--blue-light:#E6F4FB;--muted-bg:#F4F3F0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--bg-dark);padding:24px 32px;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:12px}
.header-logo svg{width:24px;height:24px}
.header-brand{font-weight:600;font-size:14px;color:rgba(255,255,255,0.8);letter-spacing:0.1em}
.header-title{font-family:'Instrument Serif',serif;font-size:22px;color:#fff;font-weight:400}
.header-back{font-size:13px;color:rgba(255,255,255,0.5);text-decoration:none;border:1px solid rgba(255,255,255,0.15);padding:6px 14px;border-radius:8px;transition:all 0.2s}
.header-back:hover{color:#fff;border-color:rgba(255,255,255,0.4)}
.container{max-width:960px;margin:0 auto;padding:32px 24px}
.section-label{font-size:12px;font-weight:600;letter-spacing:0.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:16px}
.student-list{display:flex;flex-direction:column;gap:8px;margin-bottom:40px}
.student-card{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;cursor:pointer;transition:all 0.2s}
.student-card:hover{border-color:var(--green);box-shadow:0 2px 12px rgba(46,125,79,0.08)}
.student-name{font-weight:600;font-size:15px}.student-email{font-size:13px;color:var(--text-muted);margin-top:2px}
.student-meta{text-align:right}.student-courses{font-size:13px;color:var(--text-secondary)}
.report{display:none;animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.report.visible{display:block}
.report-header{background:var(--bg-dark);border-radius:20px;padding:32px;margin-bottom:24px;position:relative;overflow:hidden}
.report-header::after{content:'';position:absolute;top:0;right:0;bottom:0;width:40%;background:radial-gradient(ellipse at 80% 50%,rgba(46,125,79,0.2),transparent);pointer-events:none}
.rh-name{font-family:'Instrument Serif',serif;font-size:32px;color:#fff;font-weight:400;margin-bottom:4px}
.rh-email{font-size:14px;color:rgba(255,255,255,0.5)}
.rh-joined{font-size:13px;color:rgba(255,255,255,0.35);margin-top:8px}
.report-close{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.1);border:none;color:rgba(255,255,255,0.6);font-size:18px;width:36px;height:36px;border-radius:50%;cursor:pointer;z-index:1;transition:all 0.2s}
.report-close:hover{background:rgba(255,255,255,0.2);color:#fff}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
@media(max-width:640px){.summary-grid{grid-template-columns:1fr}}
.scard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
.scard-label{font-size:11px;font-weight:600;letter-spacing:0.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px}
.scard-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0}
.scard-item{font-size:14px;color:var(--text-secondary)}
.scard-val{font-family:'Instrument Serif',serif;font-size:22px}
.scard-val.green{color:var(--green)}.scard-val.gold{color:var(--gold)}.scard-val.red{color:var(--red)}
.scard-sub{font-size:12px;color:var(--text-muted)}
.block{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px}
.block-title{font-family:'Instrument Serif',serif;font-size:20px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:0.03em;font-family:'DM Sans',sans-serif}
.badge-green{background:var(--green-light);color:var(--green)}
.badge-gold{background:var(--gold-light);color:#7D6608}
.badge-blue{background:var(--blue-light);color:var(--blue)}
.badge-red{background:var(--red-light);color:var(--red)}
.badge-muted{background:var(--muted-bg);color:var(--text-muted)}
.score-row{display:flex;gap:24px;margin-bottom:16px;flex-wrap:wrap}
.score-item{flex:1;min-width:90px}
.score-label{font-size:11px;font-weight:600;letter-spacing:0.08em;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px}
.score-value{font-size:28px;font-family:'Instrument Serif',serif}
.score-value.green{color:var(--green)}.score-value.gold{color:var(--gold)}.score-value.red{color:var(--red)}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green-glow));border-radius:3px;transition:width 0.6s ease}
.detail-label{font-size:13px;color:var(--text-muted)}
.sub-title{font-size:12px;font-weight:600;letter-spacing:0.08em;color:var(--text-muted);text-transform:uppercase;margin:20px 0 10px;padding-top:16px;border-top:1px solid var(--border)}
.toggle-link{font-size:13px;color:var(--green);cursor:pointer;font-weight:500;margin-top:12px;display:inline-block}
.toggle-link:hover{text-decoration:underline}
.toggle-content{display:none;margin-top:12px}.toggle-content.open{display:block}
.q-row{padding:10px 0;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.q-row:last-child{border-bottom:none}
.q-icon{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:2px}
.q-correct{background:var(--green-light);color:var(--green)}.q-wrong{background:var(--red-light);color:var(--red)}
.q-text{font-size:13px;color:var(--text-secondary);line-height:1.5}
.q-answer{font-size:12px;color:var(--text-muted);margin-top:4px}.q-answer strong{color:var(--text)}
.section-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.section-row:last-child{border-bottom:none}
.section-row-name{color:var(--text-secondary);flex:1}.section-row-time{color:var(--text-muted);text-align:right;min-width:70px}
.tool-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--border)}
.tool-row:last-child{border-bottom:none}
.tool-icon{font-size:22px;width:36px;text-align:center}
.tool-info{flex:1}.tool-name{font-weight:500;font-size:14px}.tool-detail{font-size:12px;color:var(--text-muted);margin-top:2px}
.compliance-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.compliance-row:last-child{border-bottom:none}
.compliance-label{color:var(--text-secondary)}.compliance-value{font-weight:500;text-align:right}
.compliance-date{font-size:12px;color:var(--text-muted);margin-top:2px}
.empty-field{color:var(--text-muted);font-style:italic;font-size:13px}
.loading{text-align:center;padding:60px;color:var(--text-muted);font-size:15px}
.empty-state{text-align:center;padding:40px;color:var(--text-muted);font-size:14px;background:var(--card);border:1px solid var(--border);border-radius:16px}
.print-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);cursor:pointer;border:1px solid var(--border);padding:6px 14px;border-radius:8px;background:var(--card);transition:all 0.2s;font-family:'DM Sans',sans-serif}
.print-btn:hover{border-color:var(--green);color:var(--green)}
@media print{.header,.student-list-section,.report-close,.print-btn,.header-back{display:none!important}.container{padding:0}.report{display:block!important}.block{break-inside:avoid}}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <div class="header-logo"><svg viewBox="0 0 24 24" fill="none"><path d="M10 17.5c0-1.5-1.2-2.8-2.3-4A6 6 0 1 1 16.3 13.5c-1.1 1.2-2.3 2.5-2.3 4" stroke="#43A66A" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M9.5 18.5h5" stroke="#43A66A" stroke-width="1.5" stroke-linecap="round"/><path d="M10 21h4" stroke="#43A66A" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="1" x2="12" y2="3" stroke="#43A66A" stroke-width="1.5" stroke-linecap="round"/><line x1="4.5" y1="4.5" x2="6" y2="6" stroke="#8BC6A0" stroke-width="1.5" stroke-linecap="round"/><line x1="19.5" y1="4.5" x2="18" y2="6" stroke="#8BC6A0" stroke-width="1.5" stroke-linecap="round"/></svg></div>
    <span class="header-brand">CREDIT BRIGHT</span>
    <span class="header-title">Student Reports</span>
  </div>
  <a href="website-dashboard.html" class="header-back">&larr; Dashboard</a>
</div>
<div class="container">
  <div id="student-list-section">
    <div class="section-label">Select a student</div>
    <div id="student-list" class="student-list"><div class="loading">Loading students...</div></div>
  </div>
  <div id="report" class="report"></div>
</div>
<script>
var SB_URL='https://pohsjjmcasejogfjqoth.supabase.co';
var SB_KEY='sb_publishable_YBv330YZuhZ_FtJ67iytBw_iGJuUT3c';
var sb=window.supabase.createClient(SB_URL,SB_KEY);
var ADMIN_EMAILS=['ykarov@creditbright.com','matt@creditbright.com'];
var CN={'foundation':'Foundation Course','getting_out_of_debt':'Getting Out of Debt','negotiating_better_deals':'Negotiating Better Deals'};
var TN={'calculator':'Credit Calculator','simulator':'Credit Simulator','ai_advisor':'AI Credit Advisor','calculator_embedded':'Embedded Calculator','simulator_embedded':'Embedded Simulator'};
var TI={'calculator':'🧮','simulator':'📊','ai_advisor':'💬','calculator_embedded':'🧮','simulator_embedded':'📊'};
var SN={'welcome':'Welcome','intro':'Introduction','pre_assessment':'Pre-Assessment','post_assessment':'Post-Assessment','section_1':'Section 1','section_2':'Section 2','section_3':'Section 3','section_4':'Section 4','section_5':'Section 5','section_6':'Section 6','section_7':'Section 7','mini_calculator':'Mini Calculator','mini_simulator':'Mini Simulator','certificate':'Certificate','_resume':'(bookmark)'};
function fd(d){if(!d)return'—';return new Date(d).toLocaleDateString('en-CA',{year:'numeric',month:'long',day:'numeric'})}
function ft(d){if(!d)return'—';return new Date(d).toLocaleString('en-CA',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function fm(s){if(!s)return'0 sec';if(s<60)return s+' sec';return Math.round(s/60)+' min'}
function ef(v){return '<span class="empty-field">'+(v||'No data yet')+'</span>'}

async function initAdmin(){
  try{var{data:{user},error}=await sb.auth.getUser();
  if(error||!user){window.location.href='website-login.html';return}
  if(!ADMIN_EMAILS.some(function(a){return a.toLowerCase()===(user.email||'').toLowerCase()})){window.location.href='website-dashboard.html';return}
  loadStudents()}catch(e){window.location.href='website-login.html'}}

async function loadStudents(){
  var{data:P}=await sb.from('profiles').select('id,full_name,email,created_at').order('full_name');
  if(!P||!P.length){document.getElementById('student-list').innerHTML='<div class="empty-state">No students yet.</div>';return}
  var{data:E}=await sb.from('enrollments').select('user_id,product');
  var em={};if(E)E.forEach(function(e){if(!em[e.user_id])em[e.user_id]=[];if(em[e.user_id].indexOf(e.product)===-1)em[e.user_id].push(e.product)});
  var h='';P.forEach(function(p){
    var c=em[p.id]||[];var hb=c.indexOf('bundle')!==-1;
    var l=hb?'Bundle (all courses)':c.length?c.length+' course'+(c.length!==1?'s':''):'No purchases';
    h+='<div class="student-card" onclick="loadReport(\''+p.id+'\')"><div><div class="student-name">'+(p.full_name||'Unnamed')+'</div><div class="student-email">'+(p.email||'')+'</div></div><div class="student-meta"><div class="student-courses">'+l+'</div><div style="font-size:12px;color:var(--text-muted);margin-top:2px">Joined '+fd(p.created_at)+'</div></div></div>'});
  document.getElementById('student-list').innerHTML=h}

async function loadReport(uid){
  var R=document.getElementById('report');R.className='report visible';R.innerHTML='<div class="loading">Building report...</div>';
  window.scrollTo({top:R.offsetTop-20,behavior:'smooth'});
  var[pR,eR,sR,aR,tR,cR,cnR,epR,fbR]=await Promise.all([
    sb.from('profiles').select('*').eq('id',uid).single(),
    sb.from('enrollments').select('*').eq('user_id',uid),
    sb.from('section_progress').select('*').eq('user_id',uid).order('completed_at'),
    sb.from('assessment_responses').select('*').eq('user_id',uid).order('answered_at'),
    sb.from('tool_sessions').select('*').eq('user_id',uid).order('started_at'),
    sb.from('certificates').select('*').eq('user_id',uid),
    sb.from('consents').select('*').eq('user_id',uid).order('recorded_at'),
    sb.from('email_preferences').select('*').eq('user_id',uid),
    sb.from('feedback').select('*').eq('user_id',uid).order('submitted_at')]);
  var p=pR.data,enr=eR.data||[],prog=sR.data||[],assess=aR.data||[],tools=tR.data||[],certs=cR.data||[],consents=cnR.data||[],eprefs=epR.data||[],fbk=fbR.data||[];
  if(!p){R.innerHTML='<div class="empty-state">Student not found.</div>';return}
  var h='';

  // ═══ HEADER ═══
  h+='<div class="report-header"><button class="report-close" onclick="closeReport()">&times;</button>';
  h+='<div class="rh-name">'+(p.full_name||'Unnamed')+'</div>';
  h+='<div class="rh-email">'+(p.email||'')+'</div>';
  h+='<div class="rh-joined">Joined '+fd(p.created_at)+'</div></div>';
  h+='<div style="text-align:right;margin-bottom:16px"><button class="print-btn" onclick="window.print()">🖨 Print Report</button></div>';

  // ═══ SUMMARY: PER-COURSE TIME ═══
  var CK=['foundation','getting_out_of_debt','negotiating_better_deals'];
  h+='<div class="summary-grid">';

  // Card 1: Course Time per course
  h+='<div class="scard"><div class="scard-label">Time per Course</div>';
  CK.forEach(function(ck){
    var secs=0;prog.forEach(function(sp){if(sp.course===ck&&sp.section_key!=='_resume'&&sp.time_spent_seconds)secs+=sp.time_spent_seconds});
    var enrolled=enr.some(function(e){return e.product===ck||e.product==='bundle'});
    h+='<div class="scard-row"><span class="scard-item">'+(CN[ck]||ck)+'</span><span class="scard-val">'+(enrolled?fm(secs):ef('Not enrolled'))+'</span></div>'});
  h+='</div>';

  // Card 2: Tool sessions per tool
  h+='<div class="scard"><div class="scard-label">Tool Usage</div>';
  ['calculator','simulator','ai_advisor'].forEach(function(t){
    var ts=tools.filter(function(s){return s.tool===t});
    var qs=0;ts.forEach(function(s){if(s.questions_asked)qs+=s.questions_asked});
    var detail=ts.length+' session'+(ts.length!==1?'s':'');
    if(t==='ai_advisor'&&qs>0)detail+=', '+qs+' questions';
    h+='<div class="scard-row"><span class="scard-item">'+(TN[t]||t)+'</span><span class="scard-val" style="font-size:16px">'+(ts.length>0?detail:ef('None'))+'</span></div>'});
  h+='</div>';

  // Card 3: Certificates and overall
  h+='<div class="scard"><div class="scard-label">Achievements</div>';
  h+='<div class="scard-row"><span class="scard-item">Certificates Earned</span><span class="scard-val">'+certs.length+'</span></div>';
  var totalSecs=0;prog.forEach(function(sp){if(sp.section_key!=='_resume'&&sp.time_spent_seconds)totalSecs+=sp.time_spent_seconds});
  h+='<div class="scard-row"><span class="scard-item">Total Course Time</span><span class="scard-val" style="font-size:16px">'+fm(totalSecs)+'</span></div>';
  h+='<div class="scard-row"><span class="scard-item">Total Tool Sessions</span><span class="scard-val">'+tools.length+'</span></div>';
  h+='</div></div>';

  // ═══ ENROLLMENT HISTORY ═══
  h+='<div class="block"><div class="block-title">Enrollment History</div>';
  if(!enr.length)h+='<div class="detail-label">No purchases yet.</div>';
  else{
    // Deduplicate: if bundle exists, skip individual course enrollments that the bundle covers
    var hasBundle=enr.some(function(e){return e.product==='bundle'});
    var bundleCourses=['foundation','getting_out_of_debt','negotiating_better_deals'];
    var displayed={};
    enr.forEach(function(e){
      // Skip individual course if bundle covers it and we already showed the bundle
      if(hasBundle&&bundleCourses.indexOf(e.product)!==-1)return;
      // Skip duplicate products (keep most recent by checking completed_at)
      if(displayed[e.product])return;
      displayed[e.product]=true;
      var n=CN[e.product]||e.product;if(e.product==='bundle')n='Complete Bundle (all courses)';
      var mb=(e.access_method||'paid')==='paid'?'<span class="badge badge-green">Paid</span>':'<span class="badge badge-blue">Promo</span>';
      h+='<div class="section-row"><span class="section-row-name">'+n+' '+mb+'</span>';
      h+=e.completed_at?'<span class="badge badge-green">Completed</span>':'<span class="badge badge-muted">Active</span>';
      h+='</div>'});
  }
  h+='</div>';

  // ═══ COURSE BLOCKS ═══
  CK.forEach(function(ck){
    var enrolled=enr.some(function(e){return e.product===ck||e.product==='bundle'});
    var cp=prog.filter(function(sp){return sp.course===ck&&sp.section_key!=='_resume'});
    var ca=assess.filter(function(a){return a.course===ck});
    var cc=certs.find(function(c){return c.certificate_type===ck});
    var preA=ca.filter(function(a){return a.assessment_type==='pre'});
    var postA=ca.filter(function(a){return a.assessment_type==='post'});
    var secA=ca.filter(function(a){return a.assessment_type==='section'});
    var preC=preA.filter(function(a){return a.is_correct}).length,preT=preA.length;
    var postC=postA.filter(function(a){return a.is_correct}).length,postT=postA.length;
    var secC=secA.filter(function(a){return a.is_correct}).length,secT=secA.length;
    var prePct=preT>0?Math.round(preC/preT*100):null;
    var postPct=postT>0?Math.round(postC/postT*100):null;
    var secPct=secT>0?Math.round(secC/secT*100):null;
    var confPre=ca.filter(function(a){return a.assessment_type==='confidence_pre'});
    var confPost=ca.filter(function(a){return a.assessment_type==='confidence_post'});
    var activities=ca.filter(function(a){return a.assessment_type==='activity'});
    var status=cc?'Completed':(cp.length>0?'In Progress':(enrolled?'Not Started':'Not Enrolled'));
    var sb2=cc?'badge-green':(cp.length>0?'badge-gold':(enrolled?'badge-muted':'badge-muted'));
    var cSecs=0;cp.forEach(function(sp){if(sp.time_spent_seconds)cSecs+=sp.time_spent_seconds});
    var maxS=ck==='foundation'?13:8;

    h+='<div class="block"><div class="block-title">'+(CN[ck]||ck)+' <span class="badge '+sb2+'">'+status+'</span></div>';

    // Scores row: always show all fields
    h+='<div class="score-row">';
    h+='<div class="score-item"><div class="score-label">Pre-Assessment</div><div class="score-value">'+(prePct!==null?prePct+'%':ef())+'</div>'+(preT>0?'<div class="detail-label">'+preC+' of '+preT+' correct</div>':'')+'</div>';
    h+='<div class="score-item"><div class="score-label">Post-Assessment</div><div class="score-value'+(postPct!==null?(postPct>=70?' green':postPct>=50?' gold':' red'):'')+'">'+(postPct!==null?postPct+'%':ef())+'</div>'+(postT>0?'<div class="detail-label">'+postC+' of '+postT+' correct</div>':'')+'</div>';
    h+='<div class="score-item"><div class="score-label">Improvement</div><div class="score-value';
    if(prePct!==null&&postPct!==null){var imp=postPct-prePct;h+=(imp>0?' green':imp===0?' gold':' red')+'">'+(imp>0?'+':'')+imp+'%'}
    else h+='">'+ef();
    h+='</div></div>';
    h+='<div class="score-item"><div class="score-label">Course Activities</div><div class="score-value">'+(secPct!==null?secPct+'%':ef())+'</div>'+(secT>0?'<div class="detail-label">'+secC+' of '+secT+' correct</div>':'')+'</div>';
    h+='<div class="score-item"><div class="score-label">Time Spent</div><div class="score-value">'+(enrolled?fm(cSecs):ef())+'</div></div>';
    h+='</div>';

    // Confidence ratings

    // Confidence ratings
    h+='<div class="sub-title">Confidence Self-Assessment</div>';
    if(confPre.length>0||confPost.length>0){
      h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">';
      h+='<div><div class="score-label" style="margin-bottom:8px">Before Course</div>';
      if(confPre.length>0){confPre.forEach(function(c){
        h+='<div class="section-row"><span class="section-row-name" style="font-size:12px">'+c.question_text+'</span><span class="section-row-time"><strong>'+c.user_answer+'</strong></span></div>'})}
      else{h+=ef('Not completed')}
      h+='</div><div><div class="score-label" style="margin-bottom:8px">After Course</div>';
      if(confPost.length>0){confPost.forEach(function(c){
        h+='<div class="section-row"><span class="section-row-name" style="font-size:12px">'+c.question_text+'</span><span class="section-row-time"><strong>'+c.user_answer+'</strong></span></div>'})}
      else{h+=ef('Not completed')}
      h+='</div></div>'}
    else{h+='<div class="detail-label" style="padding:8px 0">'+ef('No confidence ratings yet')+'</div>'}

    // Progress bar
    var pctD=cp.length>0?Math.min(Math.round(cp.length/maxS*100),100):0;
    h+='<div class="progress-bar"><div class="progress-fill" style="width:'+pctD+'%"></div></div>';
    var displayCount=Math.min(cp.length,maxS);
    h+='<div class="detail-label">'+displayCount+' of '+maxS+' sections visited ('+pctD+'%)</div>';

    // Certificate
    if(cc){h+='<div style="margin-top:16px;padding:14px 18px;background:var(--gold-light);border-radius:12px;font-size:13px;color:#7D6608;">🎓 Certificate <strong>'+(cc.certificate_number||'')+'</strong>';
      if(cc.pre_assessment_score!=null)h+=' | Pre: '+cc.pre_assessment_score;
      if(cc.post_assessment_score!=null)h+=' | Post: '+cc.post_assessment_score;
      if(cc.issued_at)h+=' | Issued '+fd(cc.issued_at);h+='</div>'}
    else if(enrolled){h+='<div style="margin-top:16px;padding:14px 18px;background:var(--muted-bg);border-radius:12px;font-size:13px;color:var(--text-muted);">🎓 Certificate: not yet earned</div>'}

    // Section-by-section time (visible by default)
    h+='<div class="sub-title">Section-by-Section Breakdown</div>';
    if(cp.length>0){cp.forEach(function(sp){
      var name=SN[sp.section_key]||sp.section_title||sp.section_key;
      h+='<div class="section-row"><span class="section-row-name">'+name+'</span><span class="section-row-time">'+fm(sp.time_spent_seconds)+'</span></div>'})}
    else{h+='<div class="detail-label" style="padding:8px 0">'+ef('No sections visited yet')+'</div>'}

    // Pre-assessment detail
    h+='<div class="sub-title">Pre-Assessment Detail</div>';
    if(preA.length>0){preA.forEach(function(a){
      var icon=a.is_correct?'<div class="q-icon q-correct">✓</div>':'<div class="q-icon q-wrong">✗</div>';
      h+='<div class="q-row">'+icon+'<div><div class="q-text">'+(a.question_text||a.question_key)+'</div><div class="q-answer">Answered: <strong>'+(a.user_answer||'?')+'</strong>';
      if(!a.is_correct&&a.correct_answer)h+=' (Correct: '+a.correct_answer+')';h+='</div></div></div>'})}
    else{h+='<div class="detail-label" style="padding:8px 0">'+ef('Not taken yet')+'</div>'}

    // Course activities detail
    h+='<div class="sub-title">Course Activity Results</div>';
    if(secA.length>0){secA.forEach(function(a){
      var icon=a.is_correct?'<div class="q-icon q-correct">✓</div>':'<div class="q-icon q-wrong">✗</div>';
      h+='<div class="q-row">'+icon+'<div><div class="q-text">'+(a.question_text||'Activity '+a.question_key)+'</div><div class="q-answer">Answered: <strong>'+(a.user_answer||'?')+'</strong>';
      if(!a.is_correct&&a.correct_answer)h+=' (Correct: '+a.correct_answer+')';h+='</div></div></div>'})}
    else{h+='<div class="detail-label" style="padding:8px 0">'+ef('No activity responses yet')+'</div>'}

    // Interactive exercises (Foundation only)
    if(ck==='foundation'){
      h+='<div class="sub-title">Interactive Exercises</div>';
      if(activities.length>0){activities.forEach(function(a){
        var icon=a.is_correct?'<div class="q-icon q-correct">✓</div>':'<div class="q-icon q-wrong">✗</div>';
        var label=a.question_text||a.question_key||'Exercise';
        h+='<div class="q-row">'+icon+'<div><div class="q-text">'+label+'</div><div class="q-answer">Result: <strong>'+(a.user_answer||'?')+'</strong></div></div></div>'})}
      else{h+='<div class="detail-label" style="padding:8px 0">'+ef('No interactive exercises completed yet')+'</div>'}
    }

    // Post-assessment detail
    h+='<div class="sub-title">Post-Assessment Detail</div>';
    if(postA.length>0){postA.forEach(function(a){
      var icon=a.is_correct?'<div class="q-icon q-correct">✓</div>':'<div class="q-icon q-wrong">✗</div>';
      h+='<div class="q-row">'+icon+'<div><div class="q-text">'+(a.question_text||a.question_key)+'</div><div class="q-answer">Answered: <strong>'+(a.user_answer||'?')+'</strong>';
      if(!a.is_correct&&a.correct_answer)h+=' (Correct: '+a.correct_answer+')';h+='</div></div></div>'})}
    else{h+='<div class="detail-label" style="padding:8px 0">'+ef('Not taken yet')+'</div>'}

    h+='</div>'});

  // ═══ TOOL USAGE ═══
  h+='<div class="block"><div class="block-title">Tool Usage Detail</div>';
  if(!tools.length){h+='<div class="detail-label">'+ef('No tool sessions yet')+'</div>'}
  else{
    var tg={};tools.forEach(function(t){if(!tg[t.tool])tg[t.tool]={count:0,dur:0,qs:0,doors:{},actions:0,sessions:[]};var g=tg[t.tool];g.count++;if(t.duration_seconds)g.dur+=t.duration_seconds;if(t.questions_asked)g.qs+=t.questions_asked;if(t.actions_modelled)g.actions+=t.actions_modelled;if(t.calculator_door){if(!g.doors[t.calculator_door])g.doors[t.calculator_door]=0;g.doors[t.calculator_door]++}g.sessions.push(t)});
    Object.keys(tg).sort().forEach(function(t){
      var g=tg[t];h+='<div class="tool-row"><div class="tool-icon">'+(TI[t]||'🔧')+'</div><div class="tool-info"><div class="tool-name">'+(TN[t]||t)+'</div>';
      var d=[];d.push(g.count+' session'+(g.count!==1?'s':''));if(g.dur>0)d.push(fm(g.dur)+' total');if(g.qs>0)d.push(g.qs+' questions asked');if(g.actions>0)d.push(g.actions+' actions modelled');
      var dl=Object.keys(g.doors);if(dl.length>0){var dn={'offer':'Before You Sign','debt':'After You\'ve Signed','strength':'Strengthen My Credit'};d.push('Doors: '+dl.map(function(dd){return(dn[dd]||dd)+' ('+g.doors[dd]+'x)'}).join(', '))}
      h+='<div class="tool-detail">'+d.join(' · ')+'</div></div></div>'});
    // Session detail
    h+='<div class="sub-title">Session-by-Session</div>';
    tools.forEach(function(t){
      h+='<div class="section-row"><span class="section-row-name">'+(TN[t.tool]||t.tool);if(t.calculator_door)h+=' ('+t.calculator_door+')';
      h+='</span><span class="section-row-time">'+fm(t.duration_seconds)+' · '+ft(t.started_at)+'</span></div>'})}
  h+='</div>';

  // ═══ FEEDBACK ═══
  h+='<div class="block"><div class="block-title">Student Feedback</div>';
  if(fbk.length===0){
    h+='<div class="detail-label" style="padding:8px 0">No feedback submitted yet.</div>';
  }else{
    fbk.forEach(function(fb){
      var stars='';for(var i=0;i<5;i++)stars+=(i<fb.rating?'&#9733;':'&#9734;');
      h+='<div style="margin-bottom:16px;padding:14px 18px;background:var(--muted-bg);border-radius:12px;">';
      h+='<div style="font-size:18px;color:#E6A817;margin-bottom:8px;">'+stars+'</div>';
      if(fb.learned_something!==null)h+='<div class="compliance-row"><span class="compliance-label">Learned something new</span><span class="compliance-value">'+(fb.learned_something?'Yes':'No')+'</span></div>';
      if(fb.would_recommend!==null)h+='<div class="compliance-row"><span class="compliance-label">Would recommend</span><span class="compliance-value">'+(fb.would_recommend?'Yes':'No')+'</span></div>';
      if(fb.most_useful)h+='<div style="margin-top:8px;font-size:13px;"><strong>Most useful:</strong> '+fb.most_useful+'</div>';
      if(fb.would_improve)h+='<div style="margin-top:4px;font-size:13px;"><strong>Would improve:</strong> '+fb.would_improve+'</div>';
      h+='<div style="margin-top:8px;font-size:11px;color:var(--text-muted);">Submitted '+ft(fb.submitted_at)+'</div>';
      h+='</div>';
    });
  }
  h+='</div>';

  // ═══ COMPLIANCE ═══
  h+='<div class="block"><div class="block-title">Compliance and Consent</div>';

  // Email prefs
  h+='<div class="sub-title" style="border-top:none;margin-top:0;padding-top:0">Email Preferences</div>';
  if(eprefs.length>0){var ep=eprefs[0];
    h+='<div class="compliance-row"><span class="compliance-label">Marketing Emails</span><span class="compliance-value">'+(ep.marketing_opted_in?'<span class="badge badge-green">Opted In</span>':'<span class="badge badge-muted">Opted Out</span>')+'</span></div>';
    if(ep.opted_in_at)h+='<div class="compliance-row"><span class="compliance-label">Opted In Date</span><span class="compliance-value">'+ft(ep.opted_in_at)+'</span></div>';
    if(ep.opted_out_at)h+='<div class="compliance-row"><span class="compliance-label">Opted Out Date</span><span class="compliance-value">'+ft(ep.opted_out_at)+'</span></div>';
    h+='<div class="compliance-row"><span class="compliance-label">Last Updated</span><span class="compliance-value">'+ft(ep.updated_at)+'</span></div>'}
  else{h+='<div class="compliance-row"><span class="compliance-label">Marketing Emails</span><span class="compliance-value">'+ef('No record')+'</span></div>'}

  // Consents
  var consentLabels={'terms_and_privacy':'Terms of Service and Privacy Policy','age_confirmation':'Age Confirmation (16+)','casl_marketing':'CASL Marketing Consent'};
  h+='<div class="sub-title">Consent Audit Trail</div>';
  if(consents.length>0){consents.forEach(function(c){
    var cLabel=consentLabels[c.consent_type]||c.consent_type||'Unknown';
    h+='<div class="compliance-row"><span class="compliance-label">'+cLabel+'</span>';
    h+='<span class="compliance-value">'+(c.granted?'<span class="badge badge-green">Granted</span>':'<span class="badge badge-red">Denied</span>');
    h+='<div class="compliance-date">'+fd(c.recorded_at)+'</div></span></div>'})}
  else{h+='<div class="detail-label" style="padding:8px 0">'+ef('No consent records found')+'</div>'}
  h+='</div>';

  // ═══ FEEDBACK ═══
  h+='<div class="block"><div class="block-title">Student Feedback</div>';
  if(fbk.length>0){
    fbk.forEach(function(f){
      var stars='';for(var i=0;i<5;i++)stars+=(i<f.rating?'&#9733;':'&#9734;');
      h+='<div style="padding:12px 0;border-bottom:1px solid var(--border-light)">';
      h+='<div style="font-size:18px;color:#E6A817;margin-bottom:8px">'+stars+'</div>';
      if(f.learned_something!==null)h+='<div class="detail-label">Learned something new: <strong>'+(f.learned_something?'Yes':'No')+'</strong></div>';
      if(f.would_recommend!==null)h+='<div class="detail-label">Would recommend: <strong>'+(f.would_recommend?'Yes':'No')+'</strong></div>';
      if(f.most_useful)h+='<div class="detail-label" style="margin-top:8px"><strong>Most useful:</strong> '+f.most_useful+'</div>';
      if(f.would_improve)h+='<div class="detail-label" style="margin-top:4px"><strong>Would improve:</strong> '+f.would_improve+'</div>';
      h+='<div class="detail-label" style="margin-top:6px;font-size:11px;color:var(--text-muted)">Submitted '+fd(f.submitted_at)+'</div>';
      h+='</div>'});
  }else{h+='<div class="detail-label" style="padding:8px 0">'+ef('No feedback submitted yet')+'</div>'}
  h+='</div>';

  R.innerHTML=h}

function closeReport(){var R=document.getElementById('report');R.className='report';R.innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}
function toggleSection(id){document.getElementById(id).classList.toggle('open')}
initAdmin();
</script>
</body>
</html>
